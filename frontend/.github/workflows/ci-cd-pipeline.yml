name: CI/CD Pipeline

on:
    push:
        branches:
            - main

jobs:
    test-frontend:
        runs-on: ubuntu-latest
        container:
            image: node:18-buster
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install system dependencies
              run: |
                  apt-get clean
                  apt-get update -qqy
                  apt-get install -qqy --fix-missing python3 g++ make build-essential wget
                  wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
                  echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
                  apt-get update -qqy
                  apt-get install -qqy google-chrome-stable

            - name: Set Chrome binary path
              run: echo 'export CHROME_BIN=/usr/bin/google-chrome-stable' >> $GITHUB_ENV

            - name: Install dependencies and run tests
              run: |
                  npm install --legacy-peer-deps
                  ./node_modules/.bin/ng test --watch=false --browsers=ChromeHeadlessNoSandbox

    build-frontend:
        runs-on: ubuntu-latest
        container:
            image: node:18-buster
        needs: test-frontend
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Install system dependencies
              run: |
                  apt-get update -qqy
                  apt-get install -qqy python3 g++ make build-essential wget
                  wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
                  echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | tee -a /etc/apt/sources.list.d/google-chrome.list
                  apt-get update -qqy
                  apt-get install -qqy google-chrome-stable

            - name: Set Chrome binary path
              run: echo 'export CHROME_BIN=/usr/bin/google-chrome-stable' >> $GITHUB_ENV

            - name: Install dependencies and build
              run: |
                  npm install --legacy-peer-deps
                  npm run build
