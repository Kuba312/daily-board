<section class="form-color-picker">
	<app-sub-section
		[subHeaderTitle]="'task-board-form.pick-color' | translate"
	>
		@for (tileColor of TILE_COLORS; track $index) {
			<app-tile-color
				[isChosenColor]="selectedIndexColor() === $index"
				(ngClickColorTile)="selectColor($index)"
				[tileColor]="tileColor"
			/>
		}
	</app-sub-section>
</section>
