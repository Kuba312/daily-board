<div 
	appPopover
	[mainContent]="dutiesNames()"
	[aboveContent]="'task-board-form.color-has-been-added' | translate"
	[position]="tooltipPosition"
	class="tile-color" 
	(click)="ngClickColorTile.emit(tileColor())"
>
	<div 
		class="tile-color__wrapper"
		[ngClass]="{'chosen-color': isChosenColor()}"
		[style.background]="tileColor()">
	</div>
</div>
