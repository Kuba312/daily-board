<section class="auth">
	<form class="auth__form" [formGroup]="formGroup" (ngSubmit)="submit()">
		<header class="auth__header">
			<h1>Daily Board</h1>
			<div class="auth__mode">
				<button
					type="button"
					[class.auth__mode-button--active]="isLoginMode"
					class="auth__mode-button"
					(click)="setMode('login')"
				>
					Login
				</button>
				<button
					type="button"
					[class.auth__mode-button--active]="!isLoginMode"
					class="auth__mode-button"
					(click)="setMode('register')"
				>
					Register
				</button>
			</div>
		</header>

		<label class="auth__field">
			<span>Email</span>
			<input type="email" formControlName="email" autocomplete="email" />
		</label>

		<label class="auth__field">
			<span>Password</span>
			<input
				type="password"
				formControlName="password"
				autocomplete="current-password"
			/>
		</label>

		<button class="auth__submit" type="submit" [disabled]="isSubmitting()">
			{{ isLoginMode ? 'Login' : 'Register' }}
		</button>
	</form>
</section>
