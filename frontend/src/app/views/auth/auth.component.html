<section class="auth">
	<form class="auth__form" [formGroup]="formGroup" (ngSubmit)="submit()">
		<header class="auth__header">
			<p class="auth__eyebrow">{{ 'auth.form-title' | translate }}</p>
			<h1>{{ 'app-info.name' | translate }}</h1>
			<p class="auth__lead">{{ 'auth.form-lead' | translate }}</p>
			<div class="auth__mode">
				<button
					type="button"
					[class.auth__mode-button--active]="isLoginMode"
					class="auth__mode-button"
					[disabled]="isSubmitting()"
					(click)="setMode('login')"
				>
					{{ 'auth.login' | translate }}
				</button>
				<button
					type="button"
					[class.auth__mode-button--active]="!isLoginMode"
					class="auth__mode-button"
					[disabled]="isSubmitting()"
					(click)="setMode('register')"
				>
					{{ 'auth.register' | translate }}
				</button>
			</div>
		</header>

		<label class="auth__field">
			<span>{{ 'auth.email' | translate }}</span>
			<input
				type="email"
				formControlName="email"
				autocomplete="email"
				[placeholder]="'auth.email-placeholder' | translate"
			/>
		</label>

		<label class="auth__field">
			<span>{{ 'auth.password' | translate }}</span>
			<input
				type="password"
				formControlName="password"
				autocomplete="current-password"
				[placeholder]="'auth.password-placeholder' | translate"
			/>
		</label>

		@if (authErrorKey(); as errorKey) {
			<p class="auth__error" role="alert" aria-live="polite">
				{{ errorKey | translate }}
			</p>
		}

		<button class="auth__submit" type="submit" [disabled]="isSubmitting()">
			{{ submitLabelKey | translate }}
		</button>
	</form>
</section>
