<section>
	<app-header 
		[dateDisplayMode]="DISPLAY_MODE" 
		[label]="this.plannerDetails()?.name | safeValue"
		[backToUrl]="BACK_URL"
		[useTranslate]="false"
	/>
	<div class="planner-board">
		<app-planner-board 
			[slidePlannerDirection]="slidePlannerDirection()"
			[dailyBoardDuties]="duties()"
			[plannerDetails]="plannerDetails()"
			[isDynamic]="isDynamic"
			[initialWeekIndex]="initialWeekIndex"
			(changedWeekPeriod)="onWeekPeriodChanged($event)"
			(onPlannerAnimationEnd)="onPlannerAnimationEnd()"
		/>
	</div>
</section>
