<section class="task-board-form">
	<app-header 
		[label]="isEditMode ? 'task-board-form.edit-title' : 'task-board-form.title'"
		[additionalTextLabel]="currentPlannerLabel()"
		[backToUrl]="backUrl"
		[backQueryParams]="backQueryParams"
	/>
	<div class="task-board-form__wrapper">
		@let formGroupValue = formModel()?.formGroup();
		@let formModelValue = formModel();

		@if (formModelValue && formGroupValue) {
			<form
				class="task-board-form__form" 
				[formGroup]="formGroupValue"
			>
				<div class="task-board-form__form--container">
					<app-form-input
						[controlName]="formModelValue.NAME"
						[formGroup]="formGroupValue"
						[label]="'task-board-form.task-name' | translate"
						[placeholder]="
							'task-board-form.task-name-placeholder' | translate
						"
					/>
					<app-task-input-date
						[controlName]="formModelValue.DATE"
						[customErrorMessages]="formModelValue.invalidTimeRangesMessage()"
						[label]="'task-board-form.task-date' | translate"
						[formGroup]="formGroupValue"
						[isConstantPlanner]="isConstantPlanner()"
						[showDateChips]="!isEditMode"
						[(addedChipTagsDates)]="formModelValue.addedChipTagsDates"
					/>
					@if (isConstantPlanner()) {
						<app-form-select
							[formGroup]="formGroupValue"
							[controlName]="formModelValue.DAY"
							[label]="'task-board-form.chose-day' | translate"
							[options]="formModelValue.dayOptions()"
							[isMultiple]="!isEditMode"
							[transformToSmallerCase]="true"
							translateKey="planner.full-days-names"
						/>
					}
					<app-form-textarea
						[formGroup]="formGroupValue"
						[controlName]="formModelValue.DESCRIPTION"
						[label]="'task-board-form.task-description' | translate"
						[placeholder]="
							'task-board-form.task-description-placeholder'
								| translate
						"
					/>
					<app-form-color-picker
						(selectedColor)="formModelValue.tileColor.set($event)"
						[currentColor]="formModelValue.tileColor()"
						[plannerId]="plannerId"
					/>
				</div>
				<div class="form-actions">
					@if (!isEditMode) {
						<app-primary-button
							[secondary]="true"
							[label]="'task-board-form.add-and-create' | translate"
							[emitOnClick]="true"
							[width]="30"
							(ngClick)="saveAndClearForm()"
						/>
					}
					<app-primary-button
						[label]="(isEditMode ? 'global.save' : 'task-board-form.add') | translate"
						[emitOnClick]="true"
						[width]="30"
						(ngClick)="sendForm()"
					/>
				</div>
			</form>
		}
	</div>
</section>
